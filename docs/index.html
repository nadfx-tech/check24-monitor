<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.svg">
    <title>Check24 Preismonitor</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f23;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 12px;
            padding-top: env(safe-area-inset-top, 12px);
        }
        h1 {
            text-align: center;
            color: #00d4ff;
            font-size: 1.4em;
            margin: 8px 0 16px;
        }
        .status {
            text-align: center;
            color: #666;
            font-size: 0.8em;
            margin-bottom: 12px;
        }
        .status .live { color: #44ff44; }
        .chart-box {
            background: #16213e;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.4);
        }
        .tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 16px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        .tab {
            padding: 8px 14px;
            border-radius: 8px;
            background: #16213e;
            color: #aaa;
            border: 1px solid #333;
            font-size: 0.85em;
            white-space: nowrap;
            cursor: pointer;
            flex-shrink: 0;
        }
        .tab.active {
            background: #0f3460;
            color: #00d4ff;
            border-color: #00d4ff;
        }
        .cards {
            display: grid;
            gap: 10px;
        }
        .card {
            background: #16213e;
            border-radius: 12px;
            padding: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .card-name {
            font-weight: 600;
            font-size: 1em;
            margin-bottom: 6px;
            color: #fff;
        }
        .card-price {
            font-size: 1.6em;
            font-weight: 700;
            color: #00d4ff;
        }
        .card-details {
            display: flex;
            gap: 12px;
            margin-top: 8px;
            font-size: 0.8em;
            color: #888;
        }
        .card-trend {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.85em;
            font-weight: 600;
            margin-left: 8px;
        }
        .trend-down { background: #0a3d0a; color: #44ff44; }
        .trend-up { background: #3d0a0a; color: #ff4444; }
        .trend-same { background: #333; color: #888; }
        .card-link {
            display: inline-block;
            margin-top: 10px;
            padding: 6px 14px;
            background: #0f3460;
            color: #00d4ff;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.85em;
        }
        .error {
            text-align: center;
            color: #ff4444;
            padding: 40px 20px;
        }
        .loading {
            text-align: center;
            color: #666;
            padding: 40px 20px;
        }
        @media (min-width: 600px) {
            .cards { grid-template-columns: 1fr 1fr; }
            body { padding: 20px; max-width: 900px; margin: 0 auto; }
        }
    </style>
</head>
<body>
    <h1>Check24 Preismonitor</h1>
    <p class="status" id="status">Lade Daten...</p>

    <div class="tabs" id="tabs">
        <div class="tab active" data-view="all">Alle</div>
    </div>

    <div class="chart-box">
        <canvas id="chart"></canvas>
    </div>

    <div class="cards" id="cards">
        <p class="loading">Lade Preisdaten...</p>
    </div>

    <script>
        const PRICES_URL = 'prices.json';
        const COLORS = ['#e6194b','#3cb44b','#4363d8','#f58231','#911eb4','#42d4f4','#f032e6'];

        let chart = null;
        let allData = {};
        let activeHotel = 'all';

        async function loadData() {
            try {
                const cacheBust = `?t=${Date.now()}`;
                const resp = await fetch(PRICES_URL + cacheBust);
                if (!resp.ok) throw new Error('Daten nicht verfügbar');
                allData = await resp.json();
                renderTabs();
                renderChart();
                renderCards();
                updateStatus();
            } catch (e) {
                document.getElementById('cards').innerHTML =
                    `<p class="error">Daten konnten nicht geladen werden.<br>${e.message}</p>`;
            }
        }

        function updateStatus() {
            const checks = Object.values(allData).map(h => h.last_check).filter(Boolean);
            if (checks.length === 0) return;
            const latest = new Date(Math.max(...checks.map(c => new Date(c))));
            const ago = Math.round((Date.now() - latest) / 60000);
            let agoText = ago < 1 ? 'gerade eben' : ago < 60 ? `vor ${ago} Min.` : `vor ${Math.round(ago/60)} Std.`;
            document.getElementById('status').innerHTML =
                `<span class="live">&#9679;</span> Letzter Check: ${agoText} &mdash; ${Object.keys(allData).length} Hotels`;
        }

        function renderTabs() {
            const tabs = document.getElementById('tabs');
            let html = `<div class="tab ${activeHotel==='all'?'active':''}" data-view="all">Alle</div>`;
            Object.entries(allData).forEach(([id, info]) => {
                const short = (info.name || id).split(' ').slice(0,2).join(' ');
                html += `<div class="tab ${activeHotel===id?'active':''}" data-view="${id}">${short}</div>`;
            });
            tabs.innerHTML = html;
            tabs.querySelectorAll('.tab').forEach(t => {
                t.addEventListener('click', () => {
                    activeHotel = t.dataset.view;
                    renderTabs();
                    renderChart();
                });
            });
        }

        function renderChart() {
            const ctx = document.getElementById('chart').getContext('2d');
            if (chart) chart.destroy();

            const datasets = [];
            let i = 0;
            Object.entries(allData).forEach(([id, info]) => {
                if (activeHotel !== 'all' && activeHotel !== id) return;
                const history = info.history || [];
                const points = history.map(h => ({
                    x: h.timestamp,
                    y: h.price
                }));
                if (points.length === 0) return;
                const color = COLORS[i % COLORS.length];
                datasets.push({
                    label: info.name || id,
                    data: points,
                    borderColor: color,
                    backgroundColor: color + '33',
                    tension: 0.3,
                    pointRadius: window.innerWidth < 600 ? 2 : 4,
                    borderWidth: 2,
                    fill: activeHotel !== 'all',
                });
                i++;
            });

            chart = new Chart(ctx, {
                type: 'line',
                data: { datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: {
                            display: activeHotel === 'all',
                            labels: { color: '#aaa', font: { size: 11 }, boxWidth: 12 }
                        },
                        tooltip: {
                            callbacks: {
                                label: ctx => ctx.dataset.label + ': ' + ctx.parsed.y.toLocaleString('de-DE') + ' \u20ac'
                            }
                        }
                    },
                    scales: {
                        x: {
                            type: 'time',
                            time: {
                                tooltipFormat: 'dd.MM.yyyy HH:mm',
                                displayFormats: { hour: 'HH:mm', day: 'dd.MM.' }
                            },
                            ticks: { color: '#666', maxTicksLimit: 6, font: { size: 10 } },
                            grid: { color: '#222' }
                        },
                        y: {
                            ticks: {
                                color: '#666',
                                font: { size: 10 },
                                callback: v => v.toLocaleString('de-DE') + ' \u20ac'
                            },
                            grid: { color: '#222' }
                        }
                    }
                }
            });
        }

        function renderCards() {
            const container = document.getElementById('cards');
            let html = '';

            Object.entries(allData).forEach(([id, info], i) => {
                const price = info.price;
                const first = info.first_price || price;
                const diff = price - first;
                const pct = first ? ((diff / first) * 100).toFixed(1) : '0.0';

                let trendClass, trendText;
                if (diff < 0) {
                    trendClass = 'trend-down';
                    trendText = `\u25BC ${diff.toLocaleString('de-DE')} \u20ac (${pct}%)`;
                } else if (diff > 0) {
                    trendClass = 'trend-up';
                    trendText = `\u25B2 +${diff.toLocaleString('de-DE')} \u20ac (+${pct}%)`;
                } else {
                    trendClass = 'trend-same';
                    trendText = '\u2796 unver\u00e4ndert';
                }

                html += `
                <div class="card">
                    <div class="card-name">${info.name || 'Hotel ' + id}</div>
                    <div>
                        <span class="card-price">${price ? price.toLocaleString('de-DE') + ' \u20ac' : 'n/a'}</span>
                        <span class="card-trend ${trendClass}">${trendText}</span>
                    </div>
                    <div class="card-details">
                        <span>Min: ${(info.min_price||0).toLocaleString('de-DE')} \u20ac</span>
                        <span>Max: ${(info.max_price||0).toLocaleString('de-DE')} \u20ac</span>
                    </div>
                    ${info.url ? `<a class="card-link" href="${info.url}" target="_blank">Zum Angebot \u2192</a>` : ''}
                </div>`;
            });

            container.innerHTML = html || '<p class="loading">Noch keine Daten vorhanden.</p>';
        }

        // Service Worker registrieren (PWA)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }

        // Auto-Refresh alle 5 Minuten
        loadData();
        setInterval(loadData, 5 * 60 * 1000);
    </script>
</body>
</html>
