name: Check24 Preismonitor

on:
  schedule:
    # Alle 15 Minuten
    - cron: '*/15 * * * *'
  workflow_dispatch: # Manueller Start möglich

permissions:
  contents: write

jobs:
  check-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Playwright installieren
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Preise prüfen
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor_cloud.py

      - name: Preisdaten speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet || git commit -m "Preisupdate $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
